# render.yaml — Render.com deployment configuration
# Place this file at: pulsenews/backend/render.yaml

services:
  - type: web
    name: pulsenews-api
    env: node
    region: oregon          # Change to: frankfurt, singapore, ohio as needed
    plan: free              # Upgrade to starter ($7/mo) for always-on

    # Build & start
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:migrate && node dist/server.js

    # Health check
    healthCheckPath: /api/health

    # Auto-deploy on push to main branch
    autoDeploy: true

    # Environment variables — set these in Render Dashboard → Environment
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      # Database — Render provides this automatically when you add a PostgreSQL service
      - key: DATABASE_URL
        fromDatabase:
          name: pulsenews-db
          property: connectionString

      # JWT — generate with: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure value

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      - key: COOKIE_SECRET
        generateValue: true

      # Cloudinary — paste your values from cloudinary.com dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false           # Set manually in Render dashboard

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # Frontend URL — update after deploying frontend to Vercel
      - key: ALLOWED_ORIGINS
        value: https://pulsenews.vercel.app,http://localhost:3000

      - key: FRONTEND_URL
        value: https://pulsenews.vercel.app

      # Rate limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000

      - key: RATE_LIMIT_MAX
        value: 100

# PostgreSQL database
databases:
  - name: pulsenews-db
    databaseName: pulsenews
    user: pulsenews_user
    plan: free              # 90-day free trial, then $7/mo
    region: oregon
